name: Content backup (poor-man's PITR)

# Daily JSON snapshot of the tenant's content, uploaded as a retained artifact.
# Free-tier substitute for Supabase managed backups. Restore = re-import the
# latest artifact's JSON.

on:
  schedule:
    - cron: '17 3 * * *' # daily 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Export tenant content
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SITE_SLUG: loricatus
        run: node scripts/export-tenant.js
      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: tenant-backup-${{ github.run_id }}
          path: backups/**/*.json
          retention-days: 90
