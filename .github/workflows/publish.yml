name: Publish CMS content

on:
  repository_dispatch:
    types: [publish-site]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-cms
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Use a PAT so the resulting push triggers deploy.yml
          # (pushes made with GITHUB_TOKEN do NOT trigger further workflows).
          token: ${{ secrets.PUBLISH_PAT }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install script deps
        working-directory: scripts
        run: npm install --no-audit --no-fund

      - name: Inject CMS content
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LOCALE: ${{ github.event.client_payload.locale || 'hu' }}
          PAGE: ${{ github.event.client_payload.page || 'home' }}
        run: node scripts/inject-content.js

      - name: Commit and push if changed
        run: |
          git config user.name "Loricatus CMS"
          git config user.email "noreply@loricatus.hu"
          # Stage everything inject-content may have touched: the page HTML for
          # any page/locale (incl. subpages) plus the regenerated sitemap.xml.
          git add -A
          if git diff --staged --quiet; then
            echo "No content changes to publish"
          else
            TRIGGERED_BY="${{ github.event.client_payload.triggered_by }}"
            LOCALE="${{ github.event.client_payload.locale || 'hu' }}"
            PAGE="${{ github.event.client_payload.page || 'home' }}"
            git commit -m "CMS: update ${PAGE}/${LOCALE} content (by ${TRIGGERED_BY:-manual})"
            git push
          fi
