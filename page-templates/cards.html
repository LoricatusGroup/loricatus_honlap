<header class="pg-hero">
  <div class="pg-wrap">
    <div class="section-tag" data-edit="pg-tag">Oldal</div>
    <h1 class="section-title"><span data-edit="pg-title-line1">Új</span> <span class="accent-text" data-edit="pg-title-line2">oldal</span></h1>
    <p class="section-desc" data-edit="pg-lead">Rövid bevezető ehhez a listához. A szerkesztőben átírhatod, és új kártyát is hozzáadhatsz.</p>
  </div>
</header>

<main class="pg-section">
  <div class="pg-wrap">
    <div class="ref-grid" data-list="cards" style="display:grid;grid-template-columns:1fr;gap:24px">
      <article class="ref-card" data-list-item="card-1" style="border:1px solid var(--border);border-radius:16px;padding:24px;background:var(--bg)">
        <h3 data-edit="card-1-title" style="margin:0 0 8px;font-size:20px">Első elem címe</h3>
        <p data-edit-html="card-1-body" style="margin:0;color:var(--muted);line-height:1.65"><p>Az elem leírása. Írd át a szerkesztőben.</p></p>
      </article>
      <article class="ref-card" data-list-item="card-2" style="border:1px solid var(--border);border-radius:16px;padding:24px;background:var(--bg)">
        <h3 data-edit="card-2-title" style="margin:0 0 8px;font-size:20px">Második elem címe</h3>
        <p data-edit-html="card-2-body" style="margin:0;color:var(--muted);line-height:1.65"><p>Az elem leírása. Írd át a szerkesztőben.</p></p>
      </article>
    </div>
  </div>
</main>
