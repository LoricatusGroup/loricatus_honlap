<section data-section="steps" class="section" style="background:var(--bg2)">
  <div class="container" style="max-width:940px">
    <div class="section-header" style="text-align:center;margin-bottom:36px">
      <div class="section-tag" data-edit="steps-tag" style="justify-content:center">Folyamat</div>
      <h2 class="section-title"><span data-edit="steps-title">Így dolgozunk</span></h2>
    </div>
    <div style="display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">
      <div style="padding:24px;border:1px solid var(--border);border-radius:16px;background:var(--bg)">
        <div style="width:40px;height:40px;border-radius:50%;background:var(--accent);color:#111;display:flex;align-items:center;justify-content:center;font-weight:800;margin-bottom:14px">1</div>
        <h3 style="font-size:17px;margin:0 0 8px" data-edit="steps-s1-title">Első lépés</h3>
        <p style="margin:0;color:var(--muted);line-height:1.6" data-edit="steps-s1-desc">Mi történik ebben a lépésben — röviden, érthetően.</p>
      </div>
      <div style="padding:24px;border:1px solid var(--border);border-radius:16px;background:var(--bg)">
        <div style="width:40px;height:40px;border-radius:50%;background:var(--accent);color:#111;display:flex;align-items:center;justify-content:center;font-weight:800;margin-bottom:14px">2</div>
        <h3 style="font-size:17px;margin:0 0 8px" data-edit="steps-s2-title">Második lépés</h3>
        <p style="margin:0;color:var(--muted);line-height:1.6" data-edit="steps-s2-desc">Mi történik ebben a lépésben — röviden, érthetően.</p>
      </div>
      <div style="padding:24px;border:1px solid var(--border);border-radius:16px;background:var(--bg)">
        <div style="width:40px;height:40px;border-radius:50%;background:var(--accent);color:#111;display:flex;align-items:center;justify-content:center;font-weight:800;margin-bottom:14px">3</div>
        <h3 style="font-size:17px;margin:0 0 8px" data-edit="steps-s3-title">Harmadik lépés</h3>
        <p style="margin:0;color:var(--muted);line-height:1.6" data-edit="steps-s3-desc">Mi történik ebben a lépésben — röviden, érthetően.</p>
      </div>
    </div>
  </div>
</section>
