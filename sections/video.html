<section data-section="video" class="section">
  <div class="container" style="max-width:900px">
    <div class="section-header" style="text-align:center;margin-bottom:28px">
      <div class="section-tag" data-edit="video-tag" style="justify-content:center">Videó</div>
      <h2 class="section-title"><span data-edit="video-title">Nézd meg a videót</span></h2>
    </div>
    <div data-edit-video="video-embed" style="position:relative;padding-top:56.25%;border-radius:16px;overflow:hidden;border:1px solid var(--border);background:#0b0d10">
      <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9aa2ab;font:500 14px/1.5 sans-serif;text-align:center;padding:20px">▶ Illeszd be egy YouTube vagy Vimeo videó linkjét</div>
      <iframe title="Videó" style="position:absolute;inset:0;width:100%;height:100%;border:0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
  </div>
</section>
