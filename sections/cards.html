<section data-section="cards" class="section">

    </div>

        <p style="margin:0 0 16px;color:var(--muted);line-height:1.6" data-edit="cards-c1-desc">A kártya rövid leírása — mit tartalmaz, hová vezet.</p>
        <a href="#" class="btn btn-secondary btn-sm" style="margin-top:auto;align-self:flex-start" data-edit-href="cards-c1-link"><span data-edit="cards-c1-linklabel">Tovább →</span></a>
      </div>
      <div style="background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:26px;display:flex;flex-direction:column">
